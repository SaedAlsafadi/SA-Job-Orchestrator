pprovals, submissions, and outstanding actions.</li><li>Coordinate with project teams, consultants, contractors, and other stakeholders regarding document submissions and requirements.</li><li>Ensure documents are distributed to the relevant parties in a timely manner.</li><li>Maintain electronic and hard-copy filing systems and ensure proper document archiving.</li><li>Support the preparation of document control reports and status updates.</li><li>Ensure compliance with company and client document control procedures and requirements.</li><li>Assist project teams during audits and inspections by providing the required documentation.</li><li>Follow up on missing, overdue, or incorrectly submitted documents and coordinate with the relevant parties for resolution.</li><li>Perform other document control and administrative duties as required by the project team.</li></ul><p></p>\nRequirements<ul><li> Bachelor’s degree in Business Administration, Engineering, Information Management, or a related discipline. </li><li> 3–7 years of relevant experience in document control, preferably within construction, engineering, infrastructure, or consultancy projects. </li><li> Proficient in document management systems such as Aconex, SharePoint, or equivalent platforms. </li><li> Good understanding of document control procedures, document registers, revision control, and document distribution. </li><li> Strong organizational skills with excellent attention to detail and accuracy. </li><li> Good communication and interpersonal skills, with the ability to coordinate effectively with project teams and various stakeholders. </li><li> Ability to manage multiple documents, submissions, and deadlines in a fast-paced project environment. </li><li> Familiarity with PMC, PMO, construction, or consultancy environments is an advantage.</li></ul>","identifier":{"@type":"PropertyValue","name":"id","value":"f72672e7-12b7-45aa-8157-e863755fb805"},"datePosted":"2026-08-19T10:59:55.955Z","hiringOrganiz
