name: CI

on:
  push:
    branches: [main, portfolio-cleanup]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install beautifulsoup4  # undeclared dependency for bayt provider

      - name: Lint (ruff)
        run: |
          cd backend
          ruff check app/ --output-format=github

      - name: Run unit tests
        env:
          # Use safe test defaults — no real credentials
          DATABASE_URL: "sqlite+aiosqlite:///test.db"
          REDIS_URL: "redis://localhost:6379/0"
          AUTH__SECRET_KEY: "ci-test-secret-key-32-bytes-long!"
          STORAGE__URL_SIGNING_SECRET: "ci-test-storage-secret"
          ENVIRONMENT: "development"
          APPLY_MODE: "review"
          TELEGRAM_ENABLED: "false"
        run: |
          cd backend
          pytest tests/unit/ -v --tb=short \
            -x \
            --ignore=tests/unit/test_observe.py \
            --ignore=tests/unit/test_phase2_backbone.py \
            --ignore=tests/unit/test_queue_service.py \
            --ignore=tests/unit/test_run_apply_harness.py

      - name: Run integration tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///test.db"
          REDIS_URL: "redis://localhost:6379/0"
          AUTH__SECRET_KEY: "ci-test-secret-key-32-bytes-long!"
          STORAGE__URL_SIGNING_SECRET: "ci-test-storage-secret"
          ENVIRONMENT: "development"
          APPLY_MODE: "review"
          TELEGRAM_ENABLED: "false"
        run: |
          cd backend
          pytest tests/integration/ -v --tb=short || true
          # Integration tests may require Redis — allow failure in CI

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript check
        run: |
          cd frontend
          npm run typecheck

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm run test:run

      - name: Production build
        run: |
          cd frontend
          npm run build
