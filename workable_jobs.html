troller</p><p>Role Overview<br />Support the management and control of project documentation within the Supervision Consultant team, ensuring documents are properly registered, distributed, tracked, and archived.</p><p>Key Responsibilities</p><ul><li>Register and distribute incoming and outgoing project documents. </li><li>Maintain document registers and transmittals. </li><li>Track document review and approval status. </li><li>Manage drawings, technical submissions, correspondence, and project records. </li><li>Ensure proper revision and version control. </li><li>Coordinate document submissions between project stakeholders. </li><li>Maintain electronic and physical project filing systems. </li><li>Support preparation of document control reports. </li><li>Assist with project close-out and document archiving. </li></ul><p></p><p>Project Locations</p><p>Potential opportunities may arise across:</p><ul><li>Central Region (Riyadh)</li><li>Western Region (Jeddah)</li><li>Western Region (Makkah - Madinah)</li><li>Eastern Region (Khobar - Dammam)</li><li>Southern Region (Aseer - Jazan – Najran)</li></ul><p></p><p>Why JASARA?</p><p>At Jasara, you can contribute to some of the Kingdom's most transformative projects, collaborate with industry-leading professionals, and support Saudi Arabia's long-term development goals.</p>\n<p>Minimum Requirements</p><ul><li>Diploma or Bachelor's degree in Business Administration, Engineering, Document Control, or related field. </li><li>3+ years of relevant experience </li><li>Experience working on construction projects. </li><li>Familiarity with Aconex or similar document management systems. </li><li>Strong attention to detail and organizational skills. </li></ul>","identifier":{"@type":"PropertyValue","name":"id","value":"16d549e6-cf76-4e9e-b8c3-1dc25974c27a"},"datePosted":"2026-08-25T12:45:41.424Z","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","name":"JASARA PMC","logo":"https://workablehr.s3.amazonaws.com/upl
