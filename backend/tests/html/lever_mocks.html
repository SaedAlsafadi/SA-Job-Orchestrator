<!DOCTYPE html>
<html>
<head>
    <title>Lever Mock Job Page</title>
</head>
<body>
    <div id="job-page">
        <h1>Software Engineer (Lever)</h1>
        <p>This is a fake job posting on Lever.</p>
        <a class="postings-btn" href="#" onclick="openPanel()">Apply for this job</a>
    </div>

    <!-- Application Panel / Form -->
    <div id="application-panel" style="display:none; border:1px solid #ccc; padding:20px; margin-top:20px;">
        <h2>Apply for Software Engineer</h2>
        <form id="application-form" method="POST">
            <!-- Prefilled fields (e.g. from LinkedIn integration) -->
            <div class="application-field">
                <label class="application-label">Full Name<span class="req">*</span></label>
                <input type="text" name="name" value="Jane Doe" required>
            </div>
            <div class="application-field">
                <label class="application-label">Email<span class="req">*</span></label>
                <input type="email" name="email" value="jane@example.com" required>
            </div>

            <!-- Unresolved fields -->
            <div class="application-field">
                <label class="application-label">Phone</label>
                <input type="text" name="phone">
            </div>

            <div class="application-field">
                <label class="application-label">Current Company</label>
                <input type="text" name="org">
            </div>

            <!-- Required Unknown (Custom) -->
            <div class="application-question custom-question">
                <div class="application-label">Why do you want this job?<span class="req">*</span></div>
                <textarea name="cards[1234][field0]" required></textarea>
            </div>
            
            <div class="application-question custom-question">
                <div class="application-label">Are you authorized to work?<span class="req">*</span></div>
                <label><input type="radio" name="cards[5678][field0]" value="Yes"> Yes</label>
                <label><input type="radio" name="cards[5678][field0]" value="No"> No</label>
            </div>

            <!-- CV absent -->
            <div class="application-field">
                <label class="application-label">Resume/CV</label>
                <input type="file" name="resume">
            </div>

            <button type="submit">Submit Application</button>
        </form>
    </div>

    <script>
        function openPanel() {
            document.getElementById('application-panel').style.display = 'block';
        }
    </script>
</body>
</html>
